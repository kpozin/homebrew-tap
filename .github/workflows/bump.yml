name: Bump

# The Sprawl Guard release workflow starts this workflow, which opens a pull request that moves the
# formula to the release's prebuilt archives.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Sprawl Guard release tag, such as v0.5.1
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sprawl-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Open the formula bump pull request
        shell: bash
        run: |
          # The formula follows GitHub's latest release, so prereleases and stable releases published
          # outside the latest channel leave it alone.
          latest="$(gh api repos/kpozin/sprawl-guard/releases/latest --jq .tag_name)"
          if [[ "${TAG}" != "${latest}" ]]; then
            echo "::notice::Skipping ${TAG}, because the latest Sprawl Guard release is ${latest}"
            exit 0
          fi
          bin/bump-sprawl-guard "${TAG}"
          if git diff --quiet Formula/sprawl-guard.rb; then
            echo "::notice::The formula is already at ${TAG}"
            exit 0
          fi
          version="${TAG#v}"
          branch="bump-sprawl-guard-${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "${branch}"
          git commit --quiet --message "sprawl-guard ${version}" Formula/sprawl-guard.rb
          git push --quiet origin "${branch}"
          gh pr create --head "${branch}" --title "sprawl-guard ${version}" \
            --body "Moves the formula to the [${TAG} release](https://github.com/kpozin/sprawl-guard/releases/tag/${TAG})."
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
